name: jikelog
description: "即刻日志：工作日志、笔记、备忘录、记账"
publish_to: 'none'

# 版本号由 Release Please 维护
version: 0.4.0 # x-release-please-version（Android versionCode 由构建参数 --build-number 提供）

environment:
  sdk: ^3.13.5

dependencies:
  crypto: ^3.0.7
  cryptography: ^2.9.0
  device_calendar_plus: ^0.10.1
  device_info_plus: ^13.3.0
  diff_match_patch: ^0.4.1
  dio: ^5.11.1
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_markdown_plus: ^1.0.12
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.2
  jpush_flutter: ^3.5.8
  just_audio: ^0.10.6
  open_filex: ^4.7.0
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  pdfx: ^2.11.0
  record: ^7.1.2
  shared_preferences: ^2.5.6
  table_calendar: ^3.3.0
  timezone: ^0.11.1
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  web_socket_channel: ^3.0.3
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  yaml: ^3.1.4
  drift_dev: ^2.35.1
  build_runner: ^2.16.2
  fake_async: ^1.3.3
  stream_channel: ^2.1.4
  cross_file: ^0.3.5+5
flutter:
  uses-material-design: true

  # 笔记富文本编辑器（apps/note-editor 构建产物，ADR-007）
  assets:
    - assets/editor/

  # 字体文件由仓库根目录 `bash scripts/fetch-fonts.sh` 下载（MiSans 许可禁止随源码分发）
  fonts:
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
    - family: MiSans
      fonts:
        - asset: assets/fonts/MiSans-Regular.ttf
        - asset: assets/fonts/MiSans-Semibold.ttf
          weight: 600
