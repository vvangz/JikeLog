# Git 钩子：执行 pnpm install 时自动安装（package.json 的 prepare 脚本）。
# 跳过钩子仅限紧急情况：LEFTHOOK=0 git commit ...，CI 会再次执行同样的检查。

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

pre-commit:
  parallel: true
  jobs:
    - name: gitleaks
      run: bash scripts/hooks/gitleaks.sh

    - name: gofmt
      glob: "server/**/*.go"
      run: bash scripts/hooks/gofmt.sh {staged_files}

    - name: eslint
      root: "apps/admin-web/"
      glob: "*.{ts,tsx}"
      run: pnpm exec eslint {staged_files}

    - name: dart-format
      root: "apps/mobile/"
      glob: "*.dart"
      exclude:
        - "*.g.dart"
      run: dart format --output=none --set-exit-if-changed {staged_files}

    - name: design-tokens
      glob: "packages/design-tokens/**"
      run: pnpm --filter @jikelog/design-tokens test
