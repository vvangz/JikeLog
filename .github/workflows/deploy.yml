name: 部署

# 构建并部署到正式服务器（ADR-012）：Release Please 发布新版本后由 release-please.yml 调用，
# 也可以在 Actions 页面手动运行（例如重新部署某个版本）。
# 服务器无法访问 Docker Hub，镜像在这里构建后导出为压缩包，经 SSH 上传。
#
# 需要在仓库的 production 环境中配置（只放在环境中，不要放在仓库级 Secrets）：
#   DEPLOY_HOST          服务器地址（如 39.96.207.220）
#   DEPLOY_SSH_KEY       部署专用的 SSH 私钥（对应公钥在服务器 root 的 authorized_keys 中）
#   DEPLOY_KNOWN_HOSTS   服务器的主机公钥（ssh-keyscan 的输出），防止中间人
# 并在环境中限制只允许 main 分支部署、要求审批（docs/部署运维/生产部署.md 第 1.4 节）。
on:
  workflow_dispatch:
    inputs:
      version:
        description: 要部署的版本（如 0.9.0），留空则取 version.txt
        required: false
      apk_sha256:
        description: （可选）APK 的 SHA-256，提供时与 Release 中的 APK 核对
        required: false
      msix_sha256:
        description: （可选）MSIX 的 SHA-256，提供时与 Release 中的 MSIX 核对
        required: false
  # 被调用时，调用方须写 secrets: inherit，否则读不到 production 环境的 Secrets
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      # 签名任务计算的安装包校验值（release-please.yml 传入），与 Release 中下载到的安装包核对：
      # .sha256 文件与安装包同在 Release 中，不能证明安装包在签名之后没有被替换
      apk_sha256:
        required: false
        type: string
        default: ''
      msix_sha256:
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # 官网与安装包（ADR-014）：在不带 production 环境的任务中构建，第三方依赖接触不到服务器的 SSH 密钥
  site:
    name: 官网与安装包
    runs-on: ubuntu-latest
    env:
      INPUT_VERSION: ${{ inputs.version }}
      SEMVER: '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
    steps:
      - name: 校验版本
        run: |
          if [ -n "$INPUT_VERSION" ] && ! [[ "$INPUT_VERSION" =~ $SEMVER ]]; then
            echo "::error::版本号不合法：$INPUT_VERSION"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.ref }}

      - name: 确定版本
        run: |
          v="$INPUT_VERSION"
          [ -n "$v" ] || v=$(cat version.txt)
          [[ "$v" =~ $SEMVER ]] || { echo "::error::版本号不合法：$v"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
          mkdir -p dist
          # 官网上线（ADR-014）之前的版本没有 apps/site：只部署程序，官网与下载页保持服务器上现有的
          if [ -d apps/site ]; then echo "HAS_SITE=1" >> "$GITHUB_ENV"; else echo "::warning::v$v 没有官网（apps/site），不更新官网与下载页"; fi
          echo "这个版本不含官网与安装包" > dist/README.txt

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: env.HAS_SITE == '1'
      - uses: actions/setup-node@v7
        if: env.HAS_SITE == '1'
        with:
          node-version: 22
          cache: pnpm

      - name: 构建官网
        if: env.HAS_SITE == '1'
        env:
          # ICP 备案号：备案通过后在仓库变量中设置，页脚随之显示
          SITE_ICP: ${{ vars.SITE_ICP }}
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @jikelog/site test
          pnpm --filter @jikelog/site build
          tar -czf dist/site.tar.gz -C apps/site/.vitepress/dist .

      # 官网下载页从本站下载安装包（国内访问 GitHub 不稳定）：从这个版本的 Release 取来，核对后生成 latest.json
      - name: 收集安装包
        if: env.HAS_SITE == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          APK_CERT_SHA256: ${{ vars.APK_CERT_SHA256 }}
          WINDOWS_CERT_THUMBPRINT: ${{ vars.WINDOWS_CERT_THUMBPRINT }}
          EXPECT_APK_SHA256: ${{ inputs.apk_sha256 }}
          EXPECT_MSIX_SHA256: ${{ inputs.msix_sha256 }}
        run: bash scripts/collect-downloads.sh "$VERSION" dist

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: site-bundle
          path: dist/
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: 构建并部署
    needs: site
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      # 输入只经环境变量传给脚本，不直接拼进命令（防止注入）
      INPUT_VERSION: ${{ inputs.version }}
      SEMVER: '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
    steps:
      - name: 校验版本
        run: |
          if [ -n "$INPUT_VERSION" ] && ! [[ "$INPUT_VERSION" =~ $SEMVER ]]; then
            echo "::error::版本号不合法：$INPUT_VERSION"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.ref }}

      - name: 确定版本
        run: |
          v="$INPUT_VERSION"
          [ -n "$v" ] || v=$(cat version.txt)
          [[ "$v" =~ $SEMVER ]] || { echo "::error::版本号不合法：$v"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "部署版本 $v"

      - name: 构建 API 镜像
        working-directory: server
        run: |
          docker build --build-arg COMMIT="$(git rev-parse --short HEAD)" \
            --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "jikelog-api:$VERSION" .
          mkdir -p ../dist
          docker save "jikelog-api:$VERSION" | gzip > ../dist/api.tar.gz

      - name: 构建备份镜像
        run: |
          docker build -t "jikelog-backup:$VERSION" deploy/backup
          docker save "jikelog-backup:$VERSION" | gzip > dist/backup.tar.gz

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: 构建管理后台（部署在 /admin/ 下）
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @jikelog/admin-web exec tsc --noEmit
          pnpm --filter @jikelog/admin-web exec vite build --base /admin/
          tar -czf dist/admin.tar.gz -C apps/admin-web/dist .

      - name: 打包部署配置
        run: tar -czf dist/config.tar.gz -C deploy/production compose.yml caddy scripts

      # site.tar.gz，以及 Release 中有安装包时的 downloads.tar.gz
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: site-bundle
          path: dist

      # 读不到部署密钥时让任务失败，而不是只构建、显示成功（发布包仍保存为产物）
      - name: 检查部署配置
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "::error::读不到 DEPLOY_HOST 等部署密钥：检查 production 环境的 Secrets；被调用时调用方须写 secrets: inherit"
            exit 1
          fi

      - name: 上传并部署
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          # 从 Windows 复制粘贴的值可能带 CRLF，OpenSSH 读私钥时会报 error in libcrypto
          (umask 077 && printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key)
          printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null ||
            { echo "::error::DEPLOY_SSH_KEY 不是有效的私钥：用 gh secret set DEPLOY_SSH_KEY --env production < 私钥文件 重新设置"; exit 1; }
          ssh_run() { ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes "root@$DEPLOY_HOST" "$@"; }
          # 先确认能登录，否则下面检查镜像时每次都失败，会误判为服务器缺少全部镜像
          ssh_run true || { echo "::error::无法 SSH 登录服务器：检查 DEPLOY_HOST、DEPLOY_KNOWN_HOSTS 与服务器上的公钥"; exit 1; }
          # 服务器无法访问 Docker Hub：把它缺少的第三方镜像（首次部署、升级了基础镜像）一并上传
          missing=()
          for img in $(grep -oE '^\s+image: [^$]+$' deploy/production/compose.yml | awk '{print $2}'); do
            ssh_run docker image inspect "$img" >/dev/null 2>&1 || missing+=("$img")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "服务器缺少：${missing[*]}"
            for img in "${missing[@]}"; do docker pull -q "$img"; done
            docker save "${missing[@]}" | gzip > dist/base.tar.gz
          fi
          ssh_run mkdir -p "/root/jikelog/releases/$VERSION"
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes dist/*.tar.gz "root@$DEPLOY_HOST:/root/jikelog/releases/$VERSION/"
          # 先解出部署脚本（首次部署时服务器上还没有）。版本已校验，只含数字、字母与 . -
          ssh_run "cd /root/jikelog && tar --no-same-owner -xzf releases/$VERSION/config.tar.gz scripts && bash scripts/deploy.sh $VERSION"

      - name: 保留发布包
        if: failure() && env.VERSION != ''
        uses: actions/upload-artifact@v5
        with:
          name: jikelog-${{ env.VERSION }}
          path: dist/
          retention-days: 7
