name: 发布 APK

# 构建正式签名的 Android APK 并附到 GitHub Release（docs/部署运维/发布APK.md）。
# Release Please 发布新版本后由 release-please.yml 调用；也可以在 Actions 页面手动运行，为已发布的版本重新构建。
#
# 需要在仓库的 apk-signing 环境中配置（只放在环境中，环境只允许 main 分支与 v* 标签）：
#   ANDROID_KEYSTORE_BASE64   keystore 文件的 base64
#   ANDROID_KEY_PROPERTIES    key.properties 的内容（storeFile=jikelog-release.jks、密码与别名）
# 以及仓库变量（Settings → Variables，不是机密）：
#   APP_API_BASE              正式服务器地址，如 https://www.pingvv.top
#   APP_E2E_PUBLIC_KEY        传输加密公钥（服务器上 init-env.sh 的输出）
#   APK_CERT_SHA256           签名证书的 SHA-256 指纹：核对 APK 确实用正式密钥签名，而不是调试密钥
on:
  workflow_dispatch:
    inputs:
      version:
        description: 已发布的版本（如 1.0.0）
        required: true
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: write # 上传到 Release

concurrency:
  group: release-apk-${{ inputs.version }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.6
  # pubspec.lock 记录的是国内镜像地址；锁文件含每个包的 sha256，--enforce-lockfile 会逐一校验
  PUB_HOSTED_URL: https://pub.flutter-io.cn

jobs:
  apk:
    name: 构建签名 APK
    runs-on: ubuntu-latest
    environment: apk-signing
    env:
      # 输入只经环境变量传给脚本，不直接拼进命令（防止注入）
      VERSION: ${{ inputs.version }}
      SEMVER: '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
    steps:
      - name: 校验版本
        run: |
          [[ "$VERSION" =~ $SEMVER ]] || { echo "::error::版本号不合法：$VERSION"; exit 1; }

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: v${{ inputs.version }}

      - uses: actions/cache@v6
        with:
          path: .cache/fonts
          key: fonts-${{ hashFiles('scripts/fetch-fonts.sh') }}
      - name: 下载字体（校验 SHA256）
        run: bash scripts/fetch-fonts.sh
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/mobile

      - name: 写入签名配置
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEY_PROPERTIES" ]; then
            echo "::error::读不到签名密钥：检查 apk-signing 环境的 Secrets；被调用时调用方须写 secrets: inherit"
            exit 1
          fi
          dir="$RUNNER_TEMP/signing"
          (umask 077 && mkdir -p "$dir" &&
            printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$dir/jikelog-release.jks" &&
            printf '%s\n' "$KEY_PROPERTIES" | tr -d '\r' > "$dir/key.properties")
          echo "JIKELOG_KEY_PROPERTIES=$dir/key.properties" >> "$GITHUB_ENV"

      - name: 构建
        working-directory: apps/mobile
        env:
          API_BASE: ${{ vars.APP_API_BASE }}
          E2E_PUBLIC_KEY: ${{ vars.APP_E2E_PUBLIC_KEY }}
        run: |
          [[ "$API_BASE" == https://* ]] || { echo "::error::仓库变量 APP_API_BASE 须为 https 地址"; exit 1; }
          [ -n "$E2E_PUBLIC_KEY" ] || { echo "::error::缺少仓库变量 APP_E2E_PUBLIC_KEY"; exit 1; }
          # versionCode 由版本号推出（1.2.3 → 10203），保证升级时递增
          IFS=. read -r major minor patch <<<"${VERSION%%-*}"
          flutter build apk --release --build-number=$((major * 10000 + minor * 100 + patch)) \
            --dart-define=JIKELOG_API_BASE="$API_BASE" --dart-define=JIKELOG_E2E_PUBLIC_KEY="$E2E_PUBLIC_KEY"

      - name: 核对签名证书
        env:
          EXPECTED: ${{ vars.APK_CERT_SHA256 }}
        run: |
          apk=apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          actual=$("$apksigner" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          expected=$(printf '%s' "$EXPECTED" | tr -d ': ' | tr 'A-F' 'a-f')
          if [ -z "$expected" ] || [ "$actual" != "$expected" ]; then
            echo "::error::APK 的签名证书（${actual:-无}）与仓库变量 APK_CERT_SHA256 不符，不发布"
            exit 1
          fi
          echo "签名证书 SHA-256：$actual"

      - name: 上传到 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          cp apps/mobile/build/app/outputs/flutter-apk/app-release.apk "dist/jikelog-$VERSION.apk"
          (cd dist && sha256sum "jikelog-$VERSION.apk" > "jikelog-$VERSION.apk.sha256")
          gh release upload "v$VERSION" dist/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: 清理签名文件
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing"
