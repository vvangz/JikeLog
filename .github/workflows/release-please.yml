name: Release Please

# 合入 main 后由 Release Please 根据 Conventional Commits 维护发布 PR：
# 自动更新 CHANGELOG.md 与各端版本号；合并发布 PR 时打 tag 并创建 GitHub Release。
on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          # 用 GITHUB_TOKEN 创建的 PR 不会触发 CI，main 受保护时发布 PR 无法通过检查。
          # 配置 RELEASE_PLEASE_TOKEN（仅授予本仓库 contents/pull-requests 写权限的细粒度 PAT）后自动使用它。
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # 发布新版本后部署到正式服务器（ADR-012）。用 GITHUB_TOKEN 创建的 Release 不会触发其他工作流，
  # 所以在这里直接调用部署工作流。
  deploy:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
    # 被调用的工作流读不到 production 环境的 Secrets，除非这里写 inherit（v0.9.0 发布时因此没有部署）。
    # 仓库级 Secrets 为空，部署用的 Secrets 只放在 production 环境中，inherit 不会多传其他密钥。
    secrets: inherit
