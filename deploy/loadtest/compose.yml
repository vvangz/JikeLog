# 压测环境：与正式环境（deploy/production/compose.yml）相同的镜像与资源参数，但数据独立、用完即删，
# 不会影响正式数据。由 run.sh 启动，不要单独使用。
name: jikelog-loadtest

services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_DB: jikelog, POSTGRES_USER: jikelog, POSTGRES_PASSWORD: loadtest }
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=50", "-c", "work_mem=4MB"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U jikelog -d jikelog"], interval: 2s, retries: 30 }

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru"]
    healthcheck: { test: ["CMD-SHELL", "redis-cli ping | grep PONG"], interval: 2s, retries: 30 }

  objectstore:
    image: rustfs/rustfs:1.0.1
    environment: { RUSTFS_ACCESS_KEY: loadtestkey, RUSTFS_SECRET_KEY: loadtestsecret0123456789 }

  api:
    image: ${JIKELOG_API_IMAGE:?需要 JIKELOG_API_IMAGE}
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy }, objectstore: { condition: service_started } }
    environment:
      JIKELOG_ENV: production
      JIKELOG_HTTP_ADDR: ":8080"
      # k6 直连 api，没有反向代理；按 k6 容器的地址限流（与正式环境中所有用户各自计数不同，见 setup 中的账号数）
      JIKELOG_HTTP_TRUSTED_PROXIES: 127.0.0.1/32
      JIKELOG_LOG_FORMAT: json
      JIKELOG_LOG_LEVEL: warn
      JIKELOG_DB_URL: postgres://jikelog:loadtest@postgres:5432/jikelog?sslmode=disable
      JIKELOG_REDIS_URL: redis://redis:6379/0
      JIKELOG_AUTH_JWT_SECRET: loadtest-jwt-secret-0123456789abcdef0123456789
      JIKELOG_SMS_PROVIDER: disabled
      JIKELOG_CAPTCHA_PROVIDER: none
      JIKELOG_PUSH_PROVIDER: log
      JIKELOG_E2E_PRIVATE_KEY: ${E2E_SERVER_PRIVATE_KEY:?需要 E2E_SERVER_PRIVATE_KEY}
      JIKELOG_KMS_PROVIDER: local
      JIKELOG_KMS_LOCAL_MASTER_KEY: ${KMS_MASTER_KEY:?需要 KMS_MASTER_KEY}
      JIKELOG_STORAGE_ENDPOINT: http://objectstore:9000
      JIKELOG_STORAGE_PUBLIC_ENDPOINT: https://loadtest.invalid
      JIKELOG_STORAGE_BUCKET: jikelog
      JIKELOG_STORAGE_PATH_STYLE: "true"
      JIKELOG_STORAGE_ACCESS_KEY: loadtestkey
      JIKELOG_STORAGE_SECRET_KEY: loadtestsecret0123456789

  k6:
    image: ${K6_IMAGE:-grafana/k6:1.3.0}
    profiles: [run]
    depends_on: [api]
    environment:
      BASE_URL: http://api:8080
      E2E_SERVER_KEY_ID: ${E2E_SERVER_KEY_ID}
      E2E_CLIENT_PUBLIC_KEY: ${E2E_CLIENT_PUBLIC_KEY}
      E2E_SESSION_KEY: ${E2E_SESSION_KEY}
      DURATION: ${DURATION:-2m}
      API_RATE: ${API_RATE:-30}
      SYNC_RATE: ${SYNC_RATE:-1}
      USERS: ${USERS:-8}
    volumes: ["./:/scripts:ro", "./results:/results"]
    command: ["run", "--summary-export", "/results/summary.json", "/scripts/jikelog.js"]
