openapi: 3.0.3
info:
  title: 即刻日志 JikeLog API
  version: 0.7.0 # x-release-please-version
  description: |
    即刻日志服务端接口契约，是服务端、Android 客户端、Web 管理后台三端的唯一事实来源。

    约定：
    - 所有业务接口前缀 `/api/v1`；健康检查 `/healthz`、`/readyz` 供负载均衡与容器编排探测。
    - 所有响应使用统一信封：`success`、`data`、`error`、`meta`、`requestId`。
    - 错误码使用大写蛇形字符串（如 `VALIDATION_FAILED`），HTTP 状态码表达错误类别。
    - 每个响应都带 `X-Request-ID` 头（客户端传入合法值时沿用，否则服务端生成 UUIDv7），与信封中的 `requestId` 一致。
    - 健康检查 `/healthz`、`/readyz` 同时支持 HEAD（供负载均衡探测）。
    - 除标注 `security: []` 的接口外都需要登录：请求头 `Authorization: Bearer <accessToken>`。
      令牌缺失、过期或设备已下线时返回 401 `UNAUTHORIZED`，客户端应先用 Refresh Token 刷新，刷新失败再回到登录页。
    - 超出频率限制返回 429 `RATE_LIMITED` / `SMS_RATE_LIMITED`，响应头 `Retry-After` 与 `error.details.retryAfterSeconds` 给出需等待的秒数。
    - 参数校验失败返回 422 `VALIDATION_FAILED`，`error.details.fields` 为 `{字段名: 原因}`。
servers:
  - url: http://localhost:8080
    description: 本地开发
tags:
  - name: system
    description: 健康检查与系统信息
  - name: auth
    description: 注册、登录、令牌刷新与找回密码
  - name: account
    description: 当前账号：资料、密码、手机号、设备与设置
  - name: sync
    description: 多设备同步：推送、拉取、确认、修订历史与传输加密会话（ADR-005、ADR-006）
  - name: attachment
    description: 附件：对象存储直传直下
  - name: export
    description: 数据导出：服务端异步生成 zip，完成后下载（ADR-010）
  - name: admin
    description: |
      Web 管理后台（ADR-011）。全部接口在 /api/admin/v1 下，只接受管理员令牌（adminAuth）；
      管理员令牌访问用户接口一律返回 403 `ADMIN_FORBIDDEN`。管理员只能查看用户的配置信息，看不到任何内容。

security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      tags: [system]
      operationId: getHealthz
      summary: 存活探针
      description: 进程存活即返回 200，不检查外部依赖。
      security: []
      responses:
        '200':
          description: 存活
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthEnvelope'
        default:
          $ref: '#/components/responses/Error'

  /readyz:
    get:
      tags: [system]
      operationId: getReadyz
      summary: 就绪探针
      description: 检查数据库、缓存等依赖；任一依赖不可用时返回 503。
      security: []
      responses:
        '200':
          description: 就绪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthEnvelope'
        '503':
          description: 依赖不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthEnvelope'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/system/info:
    get:
      tags: [system]
      operationId: getSystemInfo
      summary: 服务版本信息
      security: []
      responses:
        '200':
          description: 版本信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfoEnvelope'
        default:
          $ref: '#/components/responses/Error'

  # ───────────────────────────── 认证（无需登录） ─────────────────────────────
  /api/v1/auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: 用户名密码注册
      description: 注册成功即视为登录，返回会话。用户名不区分大小写唯一。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionEnvelope'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/auth/login/password:
    post:
      tags: [auth]
      operationId: loginWithPassword
      summary: 用户名密码登录
      description: 同一账号在同一网络连续失败 5 次、或在所有网络累计失败 20 次后锁定 15 分钟（`ACCOUNT_LOCKED`），短信登录可解除锁定。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordLoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionEnvelope'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/auth/sms/send:
    post:
      tags: [auth]
      operationId: sendAuthSms
      summary: 发送登录或找回密码验证码
      description: |
        同一手机号 60 秒内只能发送 1 条、每天最多 10 条，同一 IP 每小时最多 20 条，超出返回 `SMS_RATE_LIMITED`。
        找回密码时即使手机号未注册也返回成功（不发送），避免泄露手机号是否已注册。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthSmsRequest'
      responses:
        '200':
          description: 已受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsSentEnvelope'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/auth/login/sms:
    post:
      tags: [auth]
      operationId: loginWithSms
      summary: 手机号验证码登录
      description: 手机号已绑定账号时直接登录；未绑定时返回注册凭证，客户端进入"完善注册"步骤。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmsLoginRequest'
      responses:
        '200':
          description: 登录成功或需要完善注册
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsLoginResultEnvelope'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/auth/register/sms:
    post:
      tags: [auth]
      operationId: completeSmsRegistration
      summary: 完善注册（短信登录的新手机号）
      description: 使用短信登录返回的注册凭证设置用户名和密码，创建账号并自动绑定该手机号。凭证 10 分钟内有效且只能使用一次。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteSmsRegistrationRequest'
      responses:
        '201':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionEnvelope'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshToken
      summary: 刷新令牌
      description: |
        每次刷新都会轮换 Refresh Token，旧令牌随即失效。为容忍网络重试，刚被轮换的旧令牌在 30 秒内仍可再刷新一次；
        超过宽限期再次使用旧令牌会被视为令牌泄露，该设备会被强制下线。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: 新的令牌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairEnvelope'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/auth/password/reset:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: 通过手机号找回密码
      description: 重置成功后该账号所有设备都会下线。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: 重置成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckEnvelope'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: 退出登录
      description: 注销当前设备的会话。
      responses:
        '200':
          description: 已退出
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckEnvelope'
        default:
          $ref: '#/components/responses/Error'

  # ───────────────────────────── 当前账号（需登录） ─────────────────────────────
  /api/v1/me:
    get:
      tags: [account]
      operationId: getMe
      summary: 当前账号信息
      responses:
        '200':
          description: 账号信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        default:
          $ref: '#/components/responses/Error'
    patch:
      tags: [account]
      operationId: updateMe
      summary: 修改资料
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
      responses:
        '200':
          description: 修改后的账号信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/me/sms/send:
    post:
      tags: [account]
      operationId: sendAccountSms
      summary: 发送账号操作验证码
      description: |
        - `bind_phone`：向待绑定的新手机号发送，需提供 `phone`。该号码已被其他账号绑定时同样返回成功但不发送，
          避免借此探测号码是否已注册；绑定时会因验证码无效而失败。
        - `verify_current`：向当前已绑定的手机号发送，用于换绑、修改密码、注销账号时验证身份。

        频率限制与登录验证码相同。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountSmsRequest'
      responses:
        '200':
          description: 已发送
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsSentEnvelope'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/me/password:
    put:
      tags: [account]
      operationId: changePassword
      summary: 修改密码
      description: 需提供当前密码，或当前绑定手机号的验证码（`verify_current`）。修改成功后其他设备全部下线。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: 修改成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckEnvelope'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/me/phone:
    put:
      tags: [account]
      operationId: bindPhone
      summary: 绑定或换绑手机号
      description: |
        需要当前密码与新手机号的验证码（`bind_phone`）；已绑定手机号时为换绑，还需要当前手机号的验证码（`verify_current`）。
        验证码校验通过后号码仍被其他账号占用（并发绑定）时返回 `PHONE_TAKEN`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindPhoneRequest'
      responses:
        '200':
          description: 绑定后的账号信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/me/deletion:
    post:
      tags: [account]
      operationId: deleteAccount
      summary: 注销账号
      description: 永久删除账号及其全部数据，不可恢复。需提供当前密码，或当前绑定手机号的验证码（`verify_current`）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyIdentityRequest'
      responses:
        '200':
          description: 已注销
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckEnvelope'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/me/devices:
    get:
      tags: [account]
      operationId: listDevices
      summary: 已登录设备
      responses:
        '200':
          description: 按最近活跃排序的设备列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceListEnvelope'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/me/devices/{deviceId}:
    delete:
      tags: [account]
      operationId: revokeDevice
      summary: 将设备下线
      description: 该设备的令牌立即失效。不能用此接口下线当前设备（请使用退出登录）。
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 已下线
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckEnvelope'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/me/push:
    put:
      tags: [account]
      operationId: updatePush
      summary: 登记当前设备的推送
      description: |
        App 同意隐私政策并取得推送标识后调用，退出登录时设备上的登记随之清除（ADR-008）。
        服务端在备忘录提醒时刻，对尚未同步到该备忘录、或不能在本地按时提醒的设备发送推送。
        推送标识正被其他账号仍在使用的设备占用时返回 409（PUSH_TOKEN_IN_USE）；每台设备每小时最多调用 30 次。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushRegistration'
      responses:
        '200':
          description: 已保存
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckEnvelope'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/me/settings:
    get:
      tags: [account]
      operationId: getSettings
      summary: 用户设置
      responses:
        '200':
          description: 用户设置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsEnvelope'
        default:
          $ref: '#/components/responses/Error'
    put:
      tags: [account]
      operationId: updateSettings
      summary: 保存用户设置
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsInput'
      responses:
        '200':
          description: 保存后的设置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsEnvelope'
        default:
          $ref: '#/components/responses/Error'

  # ───────────────────────────── 同步（ADR-005）─────────────────────────────
  /api/v1/sync/e2e/session:
    post:
      tags: [sync]
      operationId: createE2ESession
      summary: 建立传输加密会话
      description: |
        客户端生成临时 X25519 密钥对并上传公钥，双方各自派生会话密钥（ADR-006）。
        之后的推送、拉取、修订和附件接口用请求头 `X-JikeLog-E2E` 携带返回的会话 ID，敏感字段以该会话加密。
        会话绑定当前设备，24 小时后失效；失效时接口返回 409 `E2E_SESSION_INVALID`，重新握手即可。
        `serverKeyId` 不再受支持时返回 409 `E2E_KEY_UNKNOWN`，需要升级 App。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/E2ESessionRequest'
      responses:
        '201':
          description: 已建立
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/E2ESessionEnvelope'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/sync/push:
    post:
      tags: [sync]
      operationId: pushChanges
      summary: 推送本地变更
      description: |
        每条变更只带改过的字段及其 HLC，`baseClocks` 为修改前最后一次从服务端拿到的字段时钟。
        单条变更校验失败只拒绝这一条（`rejected`），不影响同批其他变更。结果为 `merged` 或 `conflict` 时返回服务端最终记录，客户端用它覆盖本地。
        实时通知：`GET /api/v1/sync/ws`（需登录，升级为 WebSocket），服务端推送 `{"type":"hello"|"changed","seq":…,"origin":…}`，
        设备下线后以关闭码 4401 断开。
      parameters:
        - $ref: '#/components/parameters/E2ESessionHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushRequest'
      responses:
        '200':
          description: 逐条处理结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushEnvelope'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/sync/pull:
    get:
      tags: [sync]
      operationId: pullChanges
      summary: 增量拉取
      description: 按 `serverSeq` 升序返回大于 `since` 的记录（含墓碑，墓碑不含字段）。`hasMore` 为 true 时以 `nextSince` 继续拉取。
      parameters:
        - $ref: '#/components/parameters/E2ESessionHeader'
        - name: since
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
      responses:
        '200':
          description: 一页记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullEnvelope'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/sync/ack:
    post:
      tags: [sync]
      operationId: ackSync
      summary: 确认已处理的同步序号
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AckRequest'
      responses:
        '200':
          description: 已记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckEnvelope'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/records/{recordId}/revisions:
    get:
      tags: [sync]
      operationId: listRevisions
      summary: 修订历史
      description: 新的在前，不含内容。原因：edit（编辑前的状态）、conflict（冲突中落败的一方）、delete（删除前的状态）。
      parameters:
        - name: recordId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 修订列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionListEnvelope'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/revisions/{revisionId}:
    get:
      tags: [sync]
      operationId: getRevision
      summary: 修订内容
      description: 恢复某个版本即以修订内容做一次普通编辑并推送。
      parameters:
        - $ref: '#/components/parameters/E2ESessionHeader'
        - name: revisionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 修订详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionEnvelope'
        default:
          $ref: '#/components/responses/Error'

  # ───────────────────────────── 附件 ─────────────────────────────
  /api/v1/attachments:
    post:
      tags: [attachment]
      operationId: createAttachmentUpload
      summary: 申请上传附件
      description: |
        返回对象存储的预签名直传地址：客户端用 `PUT` 上传，并原样带上 `headers`（大小与类型已纳入签名）。
        上传完成后调用 complete，服务端核对大小并生成 attachment 同步记录。
        单个附件与每个账号的总量有上限（见 usage），超出时返回 413 `ATTACHMENT_TOO_LARGE` / `QUOTA_EXCEEDED`。
      parameters:
        - $ref: '#/components/parameters/E2ESessionHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachmentUploadRequest'
      responses:
        '201':
          description: 上传地址
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentUploadEnvelope'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/attachments/usage:
    get:
      tags: [attachment]
      operationId: getAttachmentUsage
      summary: 附件用量
      responses:
        '200':
          description: 用量与上限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentUsageEnvelope'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/attachments/{attachmentId}/complete:
    post:
      tags: [attachment]
      operationId: completeAttachmentUpload
      summary: 确认上传完成
      description: 对象尚未上传或大小不符时返回 409 `UPLOAD_INCOMPLETE`。重复调用是幂等的。
      parameters:
        - name: attachmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 已生成同步记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentCompleteEnvelope'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/attachments/{attachmentId}/download:
    get:
      tags: [attachment]
      operationId: getAttachmentDownload
      summary: 获取下载地址
      parameters:
        - name: attachmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 预签名下载地址（10 分钟内有效）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentDownloadEnvelope'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/exports:
    get:
      tags: [export]
      operationId: listExports
      summary: 最近的导出
      description: 最近 10 次导出，新的在前。
      responses:
        '200':
          description: 导出列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportListEnvelope'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [export]
      operationId: createExport
      summary: 发起导出
      description: |
        在后台生成所选模块的 zip，完成后向发起导出的设备推送通知。导出文件保留 24 小时。
        同一账号同时只能有一个进行中的导出（409 `EXPORT_IN_PROGRESS`），24 小时内最多发起 5 次（429 `EXPORT_LIMIT`）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRequest'
      responses:
        '202':
          description: 已排队
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportEnvelope'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/exports/{exportId}:
    get:
      tags: [export]
      operationId: getExport
      summary: 导出状态
      parameters:
        - $ref: '#/components/parameters/ExportId'
      responses:
        '200':
          description: 导出
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportEnvelope'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags: [export]
      operationId: deleteExport
      summary: 删除导出
      description: 删除导出文件与记录。进行中的导出不能删除（409 `EXPORT_IN_PROGRESS`）。
      parameters:
        - $ref: '#/components/parameters/ExportId'
      responses:
        '200':
          description: 已删除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckEnvelope'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/exports/{exportId}/download:
    get:
      tags: [export]
      operationId: getExportDownload
      summary: 获取导出文件的下载地址
      description: 只有已完成且未过期的导出可以下载，否则返回 409 `EXPORT_NOT_READY`。
      parameters:
        - $ref: '#/components/parameters/ExportId'
      responses:
        '200':
          description: 预签名下载地址（10 分钟内有效）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentDownloadEnvelope'
        default:
          $ref: '#/components/responses/Error'

  /api/admin/v1/auth/login:
    post:
      tags: [admin]
      operationId: adminLogin
      summary: 管理员登录
      description: |
        成功时返回 Access Token（15 分钟），Refresh Token 写入 HttpOnly Cookie。
        同一账号连续 5 次失败锁定 15 分钟（423 `ADMIN_LOCKED`）；用户名或密码错误统一返回 401 `INVALID_CREDENTIALS`。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
      responses:
        '200':
          description: 登录成功
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSessionEnvelope'
        default:
          $ref: '#/components/responses/Error'

  /api/admin/v1/auth/refresh:
    post:
      tags: [admin]
      operationId: adminRefresh
      summary: 刷新管理员会话
      description: 用 Cookie 中的 Refresh Token 换取新的 Access Token，Refresh Token 同时轮换。
      security: []
      parameters:
        - $ref: '#/components/parameters/AdminCsrfHeader'
        - $ref: '#/components/parameters/AdminRefreshCookie'
      responses:
        '200':
          description: 新的会话
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSessionEnvelope'
        default:
          $ref: '#/components/responses/Error'

  /api/admin/v1/auth/logout:
    post:
      tags: [admin]
      operationId: adminLogout
      summary: 管理员退出
      security: []
      parameters:
        - $ref: '#/components/parameters/AdminCsrfHeader'
        - $ref: '#/components/parameters/AdminRefreshCookie'
      responses:
        '200':
          description: 已退出
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckEnvelope'
        default:
          $ref: '#/components/responses/Error'

  /api/admin/v1/me:
    get:
      tags: [admin]
      operationId: adminMe
      summary: 当前管理员
      security:
        - adminAuth: []
      responses:
        '200':
          description: 当前管理员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProfileEnvelope'
        default:
          $ref: '#/components/responses/Error'

  /api/admin/v1/me/password:
    put:
      tags: [admin]
      operationId: adminChangePassword
      summary: 修改自己的密码
      description: 修改后其他会话全部失效，当前会话保留。
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminChangePasswordRequest'
      responses:
        '200':
          description: 已修改
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckEnvelope'
        default:
          $ref: '#/components/responses/Error'

  /api/admin/v1/dashboard:
    get:
      tags: [admin]
      operationId: adminDashboard
      summary: 仪表盘
      security:
        - adminAuth: []
      responses:
        '200':
          description: 统计数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDashboardEnvelope'
        default:
          $ref: '#/components/responses/Error'

  /api/admin/v1/users:
    get:
      tags: [admin]
      operationId: adminListUsers
      summary: 用户列表
      description: 按用户名、昵称搜索；输入恰好 4 位数字时也匹配手机号末 4 位。手机号脱敏返回。
      security:
        - adminAuth: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 30
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserListEnvelope'
        default:
          $ref: '#/components/responses/Error'

  /api/admin/v1/users/{userId}:
    get:
      tags: [admin]
      operationId: adminGetUser
      summary: 用户详情（只有配置，不含内容）
      security:
        - adminAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 用户配置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserDetailEnvelope'
        default:
          $ref: '#/components/responses/Error'

  /api/admin/v1/audit-logs:
    get:
      tags: [admin]
      operationId: adminListAuditLogs
      summary: 审计日志
      security:
        - adminAuth: []
      parameters:
        - name: adminId
          in: query
          schema:
            type: string
            format: uuid
        - name: action
          in: query
          schema:
            $ref: '#/components/schemas/AuditAction'
        - name: from
          in: query
          description: 起始时刻（含）
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: 截止时刻（不含）
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 审计日志，新的在前
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogListEnvelope'
        default:
          $ref: '#/components/responses/Error'

  /api/admin/v1/admins:
    get:
      tags: [admin]
      operationId: adminListAdmins
      summary: 管理员列表（仅超级管理员）
      security:
        - adminAuth: []
      responses:
        '200':
          description: 管理员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProfileListEnvelope'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [admin]
      operationId: adminCreateAdmin
      summary: 新建管理员（仅超级管理员）
      description: 新管理员第一次登录时必须修改密码。用户名已存在时返回 409 `USERNAME_TAKEN`。
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreateRequest'
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProfileEnvelope'
        default:
          $ref: '#/components/responses/Error'

  /api/admin/v1/admins/{adminId}:
    patch:
      tags: [admin]
      operationId: adminUpdateAdmin
      summary: 修改角色或停用（仅超级管理员）
      description: 不能修改自己；不能停用或降级最后一个超级管理员（409 `LAST_SUPER_ADMIN`）。停用后该管理员的会话立即失效。
      security:
        - adminAuth: []
      parameters:
        - $ref: '#/components/parameters/AdminId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateRequest'
      responses:
        '200':
          description: 已修改
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProfileEnvelope'
        default:
          $ref: '#/components/responses/Error'

  /api/admin/v1/admins/{adminId}/password:
    post:
      tags: [admin]
      operationId: adminResetPassword
      summary: 重置管理员密码（仅超级管理员）
      description: 该管理员的会话全部失效，下次登录必须修改密码。不能用于自己（请使用修改密码）。
      security:
        - adminAuth: []
      parameters:
        - $ref: '#/components/parameters/AdminId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminResetPasswordRequest'
      responses:
        '200':
          description: 已重置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckEnvelope'
        default:
          $ref: '#/components/responses/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    adminAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 管理员 Access Token（受众 admin），与用户令牌不能互用

  parameters:
    AdminId:
      name: adminId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AdminCsrfHeader:
      name: X-JikeLog-Admin
      in: header
      required: true
      description: 固定为 1。跨站页面不能随意设置自定义请求头，以此防止跨站请求伪造
      schema:
        type: string
        enum: ['1']
    AdminRefreshCookie:
      name: jikelog_admin_refresh
      in: cookie
      required: false
      schema:
        type: string
        maxLength: 100
    Page:
      name: page
      in: query
      description: 页码，从 1 开始
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    ExportId:
      name: exportId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    E2ESessionHeader:
      name: X-JikeLog-E2E
      in: header
      required: false
      description: 传输加密会话 ID（见 createE2ESession）；请求或响应含敏感字段时必须携带
      schema:
        type: string
        maxLength: 64

  responses:
    Error:
      description: 错误（4xx/5xx），统一使用错误信封
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: 机器可读错误码
          example: VALIDATION_FAILED
        message:
          type: string
          description: 面向用户的错误描述
          example: 参数校验失败
        details:
          type: object
          additionalProperties: true
          description: 附加信息，如字段级校验错误

    PageMeta:
      type: object
      required: [total, page, limit]
      properties:
        total:
          type: integer
          format: int64
        page:
          type: integer
        limit:
          type: integer

    EnvelopeBase:
      type: object
      required: [success, requestId]
      properties:
        success:
          type: boolean
        error:
          $ref: '#/components/schemas/ErrorBody'
        meta:
          $ref: '#/components/schemas/PageMeta'
        requestId:
          type: string
          description: 请求 ID，与响应头 X-Request-ID 一致，便于排查

    ErrorEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [error]
          properties:
            error:
              $ref: '#/components/schemas/ErrorBody'

    HealthCheck:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
          example: postgres
        status:
          type: string
          enum: [up, down]
        error:
          type: string

    Health:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [up, down]
        checks:
          type: array
          items:
            $ref: '#/components/schemas/HealthCheck'

    HealthEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/Health'

    SystemInfo:
      type: object
      required: [name, version, commit, buildTime, serverTime]
      properties:
        name:
          type: string
          example: jikelog-api
        version:
          type: string
          example: 0.1.0
        commit:
          type: string
        buildTime:
          type: string
        serverTime:
          type: string
          format: date-time

    SystemInfoEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/SystemInfo'

    # ───────────────────────────── 认证与账号 ─────────────────────────────
    Ack:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean

    AckEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/Ack'

    Username:
      type: string
      description: 4–20 位，字母开头，只含字母、数字、下划线；不区分大小写唯一
      pattern: '^[A-Za-z][A-Za-z0-9_]{3,19}$'
      example: zhang_san

    Password:
      type: string
      description: 8–128 位，至少包含字母和数字
      minLength: 8
      maxLength: 128
      format: password

    Phone:
      type: string
      description: 中国大陆手机号，可带 +86 前缀
      example: '13812345678'

    SmsCode:
      type: string
      description: 6 位数字验证码，5 分钟内有效，最多尝试 5 次
      pattern: '^[0-9]{6}$'

    Nickname:
      type: string
      description: 昵称，最多 20 个字符
      maxLength: 20

    DeviceInfo:
      type: object
      description: 客户端设备信息。`installationId` 由客户端首次启动时生成并持久保存，同一安装实例重复登录同一账号时复用设备记录。
      required: [installationId, platform]
      properties:
        installationId:
          type: string
          minLength: 8
          maxLength: 64
        platform:
          type: string
          enum: [android, ios, windows, macos, linux, web]
        model:
          type: string
          maxLength: 64
          example: Xiaomi 14
        osVersion:
          type: string
          maxLength: 64
          example: Android 15
        appVersion:
          type: string
          maxLength: 32
          example: 0.2.0

    RegisterRequest:
      type: object
      required: [username, password, device]
      properties:
        username:
          $ref: '#/components/schemas/Username'
        password:
          $ref: '#/components/schemas/Password'
        nickname:
          $ref: '#/components/schemas/Nickname'
        device:
          $ref: '#/components/schemas/DeviceInfo'

    PasswordLoginRequest:
      type: object
      required: [username, password, device]
      properties:
        username:
          type: string
          maxLength: 64
        password:
          type: string
          maxLength: 512
          format: password
        device:
          $ref: '#/components/schemas/DeviceInfo'

    SmsPurpose:
      type: string
      enum: [login, reset_password]

    AuthSmsRequest:
      type: object
      required: [phone, purpose]
      properties:
        phone:
          $ref: '#/components/schemas/Phone'
        purpose:
          $ref: '#/components/schemas/SmsPurpose'
        captchaVerifyParam:
          type: string
          maxLength: 4096
          description: 人机验证结果（阿里云验证码 2.0），开发环境可省略

    AccountSmsPurpose:
      type: string
      enum: [bind_phone, verify_current]

    AccountSmsRequest:
      type: object
      required: [purpose]
      properties:
        purpose:
          $ref: '#/components/schemas/AccountSmsPurpose'
        phone:
          $ref: '#/components/schemas/Phone'
        captchaVerifyParam:
          type: string
          maxLength: 4096

    SmsSent:
      type: object
      required: [cooldownSeconds, expiresInSeconds]
      properties:
        cooldownSeconds:
          type: integer
          description: 距离可再次发送的秒数
          example: 60
        expiresInSeconds:
          type: integer
          description: 验证码有效期（秒）
          example: 300

    SmsSentEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/SmsSent'

    SmsLoginRequest:
      type: object
      required: [phone, code, device]
      properties:
        phone:
          $ref: '#/components/schemas/Phone'
        code:
          $ref: '#/components/schemas/SmsCode'
        device:
          $ref: '#/components/schemas/DeviceInfo'

    SmsLoginResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [authenticated, registration_required]
        session:
          $ref: '#/components/schemas/AuthSession'
        registrationTicket:
          type: string
          description: status 为 registration_required 时返回，用于完善注册
        phoneMasked:
          type: string
          description: status 为 registration_required 时返回，供界面展示
          example: 138****5678

    SmsLoginResultEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/SmsLoginResult'

    CompleteSmsRegistrationRequest:
      type: object
      required: [registrationTicket, username, password, device]
      properties:
        registrationTicket:
          type: string
          maxLength: 128
        username:
          $ref: '#/components/schemas/Username'
        password:
          $ref: '#/components/schemas/Password'
        nickname:
          $ref: '#/components/schemas/Nickname'
        device:
          $ref: '#/components/schemas/DeviceInfo'

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          maxLength: 128

    ResetPasswordRequest:
      type: object
      required: [phone, code, newPassword]
      properties:
        phone:
          $ref: '#/components/schemas/Phone'
        code:
          $ref: '#/components/schemas/SmsCode'
        newPassword:
          $ref: '#/components/schemas/Password'

    TokenPair:
      type: object
      required: [tokenType, accessToken, accessExpiresAt, refreshToken, refreshExpiresAt]
      properties:
        tokenType:
          type: string
          enum: [Bearer]
        accessToken:
          type: string
        accessExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
        refreshExpiresAt:
          type: string
          format: date-time

    TokenPairEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/TokenPair'

    User:
      type: object
      required: [id, username, nickname, hasPhone, createdAt]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        nickname:
          type: string
        hasPhone:
          type: boolean
        phoneMasked:
          type: string
          description: 脱敏后的手机号，未绑定时不返回
          example: 138****5678
        createdAt:
          type: string
          format: date-time

    UserEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/User'

    AuthSession:
      type: object
      required: [user, tokens, deviceId]
      properties:
        user:
          $ref: '#/components/schemas/User'
        tokens:
          $ref: '#/components/schemas/TokenPair'
        deviceId:
          type: string
          format: uuid
          description: 服务端为本次登录分配的设备 ID

    AuthSessionEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/AuthSession'

    UpdateMeRequest:
      type: object
      required: [nickname]
      properties:
        nickname:
          $ref: '#/components/schemas/Nickname'

    VerifyIdentityRequest:
      type: object
      description: 当前密码与当前手机号验证码二选一
      properties:
        currentPassword:
          type: string
          maxLength: 512
          format: password
        smsCode:
          $ref: '#/components/schemas/SmsCode'

    ChangePasswordRequest:
      allOf:
        - $ref: '#/components/schemas/VerifyIdentityRequest'
        - type: object
          required: [newPassword]
          properties:
            newPassword:
              $ref: '#/components/schemas/Password'

    BindPhoneRequest:
      type: object
      required: [phone, code, currentPassword]
      properties:
        phone:
          $ref: '#/components/schemas/Phone'
        code:
          $ref: '#/components/schemas/SmsCode'
        currentPassword:
          type: string
          maxLength: 512
          format: password
          description: 当前密码，防止他人用被盗的登录态绑定自己的号码接管账号
        currentCode:
          $ref: '#/components/schemas/SmsCode'

    Device:
      type: object
      required: [id, platform, model, osVersion, appVersion, lastActiveAt, createdAt, current]
      properties:
        id:
          type: string
          format: uuid
        platform:
          type: string
        model:
          type: string
        osVersion:
          type: string
        appVersion:
          type: string
        lastActiveAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        current:
          type: boolean
          description: 是否为发起请求的设备

    DeviceListEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Device'

    ThemeMode:
      type: string
      enum: [system, light, dark]

    PushRegistration:
      type: object
      required: [timeZone, localReminders]
      properties:
        provider:
          type: string
          enum: [jpush]
          nullable: true
          description: 推送通道；为空表示该设备不接收服务端推送
        token:
          type: string
          nullable: true
          minLength: 1
          maxLength: 128
          description: 推送通道分配的设备标识（极光 Registration ID），与 provider 同时为空或同时非空
        timeZone:
          type: string
          maxLength: 64
          description: 设备时区（IANA 名称，如 Asia/Shanghai），推送文案中的时间按它显示
        localReminders:
          type: boolean
          description: 设备能否自己按时弹出提醒（已授予通知与精确闹钟权限）
        localUntil:
          type: string
          format: date-time
          nullable: true
          description: 本地闹钟覆盖到的时刻（设备只排定最近若干条提醒），晚于此刻的提醒仍由服务端推送；为空表示全部覆盖

    SettingsInput:
      type: object
      required: [themeMode, fontScale, defaultReminders, weekStart]
      properties:
        themeMode:
          $ref: '#/components/schemas/ThemeMode'
        fontScale:
          type: number
          format: float
          minimum: 0.8
          maximum: 1.4
          description: 字号缩放
        defaultReminders:
          type: array
          maxItems: 5
          description: 新建备忘录时默认的提前提醒（分钟，0 表示准时），不超过 30 天
          items:
            type: integer
            format: int32
            minimum: 0
            maximum: 43200
        weekStart:
          type: integer
          enum: [1, 7]
          description: 一周的第一天：1 = 周一，7 = 周日

    Settings:
      allOf:
        - $ref: '#/components/schemas/SettingsInput'
        - type: object
          required: [updatedAt]
          properties:
            updatedAt:
              type: string
              format: date-time

    SettingsEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/Settings'

    # ───────────────────────────── 同步与附件 ─────────────────────────────
    E2ESessionRequest:
      type: object
      required: [clientPublicKey, serverKeyId]
      properties:
        clientPublicKey:
          type: string
          description: 客户端临时 X25519 公钥（标准 base64，32 字节）
          maxLength: 64
        serverKeyId:
          type: string
          description: App 内置服务端公钥的标识（SHA-256 前 8 字节的十六进制）
          maxLength: 32

    E2ESession:
      type: object
      required: [sessionId, expiresAt]
      properties:
        sessionId:
          type: string
        expiresAt:
          type: string
          format: date-time

    E2ESessionEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/E2ESession'

    SyncChange:
      type: object
      required: [entity, id]
      properties:
        entity:
          type: string
          description: 实体类型：worklog（工作日志）、note（笔记）、note_folder（笔记文件夹）、memo（备忘录）、ledger_account（账户）、ledger_category（收支分类）、ledger_loan（借贷）、ledger_entry（流水）、attachment（附件，只能删除）。字段定义见 ADR-005、ADR-007、ADR-008、ADR-009
          maxLength: 32
        id:
          type: string
          format: uuid
          description: 客户端生成的 UUIDv7
        deleted:
          type: boolean
          description: 为 true 时删除记录（墓碑）
        fields:
          type: object
          description: 改过的字段：字符串、整数或 null；敏感字段为传输密文（AAD 以 `|v` 结尾）
          additionalProperties: {}
          x-go-type: map[string]json.RawMessage
        clocks:
          type: object
          description: 改过字段的混合逻辑时钟（HLC）`<13 位毫秒>-<4 位十六进制计数>-<16 位十六进制节点>`
          additionalProperties:
            type: string
        baseClocks:
          type: object
          description: 修改前最后一次从服务端拿到的字段时钟
          additionalProperties:
            type: string
        patches:
          type: object
          description: 长文本字段相对基准文本的补丁（JSON 字符串）；敏感字段为传输密文（AAD 以 `|p` 结尾）
          additionalProperties:
            type: string

    PushRequest:
      type: object
      required: [changes]
      properties:
        changes:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/SyncChange'

    SyncRecord:
      type: object
      required: [entity, id, version, serverSeq, deleted, fields, clocks, updatedAt]
      properties:
        entity:
          type: string
        id:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
        serverSeq:
          type: integer
          format: int64
        deleted:
          type: boolean
        fields:
          type: object
          description: 字段值；敏感字段为传输密文。墓碑为空对象
          additionalProperties: {}
        clocks:
          type: object
          additionalProperties:
            type: string
        updatedAt:
          type: string
          format: date-time

    ChangeError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: VALIDATION_FAILED / UNKNOWN_ENTITY / CLOCK_SKEW / ID_CONFLICT / E2E_DECRYPT_FAILED
        message:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string

    PushResult:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [applied, merged, conflict, rejected]
        version:
          type: integer
          format: int64
        serverSeq:
          type: integer
          format: int64
        record:
          $ref: '#/components/schemas/SyncRecord'
        error:
          $ref: '#/components/schemas/ChangeError'

    PushResponse:
      type: object
      required: [results, cursor]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/PushResult'
        cursor:
          type: integer
          format: int64
          description: 处理后账号的同步序号

    PushEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/PushResponse'

    PullResponse:
      type: object
      required: [records, nextSince, hasMore]
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/SyncRecord'
        nextSince:
          type: integer
          format: int64
        hasMore:
          type: boolean

    PullEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/PullResponse'

    AckRequest:
      type: object
      required: [seq]
      properties:
        seq:
          type: integer
          format: int64
          minimum: 0

    RevisionInfo:
      type: object
      required: [id, version, reason, createdAt, deviceModel]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
        reason:
          type: string
          enum: [edit, conflict, delete]
        createdAt:
          type: string
          format: date-time
        deviceModel:
          type: string
          description: 产生该修订的设备型号，设备已删除时为空

    RevisionListEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/RevisionInfo'

    Revision:
      type: object
      required: [id, recordId, entity, version, reason, createdAt, fields]
      properties:
        id:
          type: string
          format: uuid
        recordId:
          type: string
          format: uuid
        entity:
          type: string
        version:
          type: integer
          format: int64
        reason:
          type: string
          enum: [edit, conflict, delete]
        createdAt:
          type: string
          format: date-time
        fields:
          type: object
          description: 字段值；敏感字段为传输密文
          additionalProperties: {}

    RevisionEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/Revision'

    AttachmentUploadRequest:
      type: object
      required: [id, ownerEntity, ownerId, fileName, mime, size, sha256]
      properties:
        id:
          type: string
          format: uuid
          description: 客户端生成的 UUIDv7，同时作为 attachment 同步记录的 ID
        ownerEntity:
          type: string
          description: 所属记录的实体类型，只能是 worklog 或 note
          maxLength: 32
        ownerId:
          type: string
          format: uuid
        fileName:
          type: string
          description: 文件名的传输密文（AAD 为 `jikelog-e2e-v1|attachment|<id>|fileName|v`）
          maxLength: 2048
        mime:
          type: string
          maxLength: 127
          example: image/jpeg
        size:
          type: integer
          format: int64
          minimum: 1
        sha256:
          type: string
          description: 文件内容的 SHA-256（小写十六进制），下载后客户端据此校验
          maxLength: 64

    AttachmentUpload:
      type: object
      required: [uploadUrl, method, headers, expiresAt]
      properties:
        uploadUrl:
          type: string
        method:
          type: string
          enum: [PUT]
        headers:
          type: object
          additionalProperties:
            type: string
        expiresAt:
          type: string
          format: date-time

    AttachmentUploadEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/AttachmentUpload'

    AttachmentComplete:
      type: object
      required: [serverSeq]
      properties:
        serverSeq:
          type: integer
          format: int64

    AttachmentCompleteEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/AttachmentComplete'

    AttachmentDownload:
      type: object
      required: [url, expiresAt]
      properties:
        url:
          type: string
        expiresAt:
          type: string
          format: date-time

    AttachmentDownloadEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/AttachmentDownload'

    AttachmentUsage:
      type: object
      required: [used, quota, maxSize]
      properties:
        used:
          type: integer
          format: int64
        quota:
          type: integer
          format: int64
        maxSize:
          type: integer
          format: int64

    AttachmentUsageEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/AttachmentUsage'

    ExportModule:
      type: string
      enum: [worklog, note, memo, ledger]

    ExportRequest:
      type: object
      required: [modules, attachments]
      properties:
        modules:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ExportModule'
        attachments:
          type: boolean
          description: 是否包含工作日志与笔记的附件文件

    Export:
      type: object
      required: [id, modules, attachments, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        modules:
          type: array
          items:
            $ref: '#/components/schemas/ExportModule'
        attachments:
          type: boolean
        status:
          type: string
          enum: [pending, running, done, failed, expired]
          description: pending 排队中 / running 生成中 / done 可下载 / failed 失败 / expired 文件已删除
        size:
          type: integer
          format: int64
          description: zip 大小（字节），完成后才有
        error:
          type: string
          description: 失败原因
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: 导出文件的删除时刻

    ExportEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/Export'

    ExportListEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Export'

    # ───────────────────────────── 管理后台 ─────────────────────────────
    AdminRole:
      type: string
      enum: [super_admin, viewer]

    AdminProfile:
      type: object
      required: [id, username, role, disabled, mustChangePassword, createdAt]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        role:
          $ref: '#/components/schemas/AdminRole'
        disabled:
          type: boolean
        mustChangePassword:
          type: boolean
          description: 为 true 时必须先修改密码，其他接口返回 403 `PASSWORD_CHANGE_REQUIRED`
        lastLoginAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    AdminProfileEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/AdminProfile'

    AdminProfileListEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/AdminProfile'

    AdminLoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 20
        password:
          type: string
          maxLength: 128

    AdminSession:
      type: object
      required: [accessToken, expiresAt, admin]
      properties:
        accessToken:
          type: string
        expiresAt:
          type: string
          format: date-time
        admin:
          $ref: '#/components/schemas/AdminProfile'

    AdminSessionEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/AdminSession'

    AdminChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          maxLength: 128
        newPassword:
          type: string
          minLength: 10
          maxLength: 128

    AdminCreateRequest:
      type: object
      required: [username, role, password]
      properties:
        username:
          type: string
          maxLength: 20
        role:
          $ref: '#/components/schemas/AdminRole'
        password:
          type: string
          minLength: 10
          maxLength: 128
          description: 初始密码，对方第一次登录时必须修改

    AdminUpdateRequest:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/AdminRole'
        disabled:
          type: boolean

    AdminResetPasswordRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 10
          maxLength: 128

    AdminDashboard:
      type: object
      required: [totalUsers, newUsersToday, activeToday, activeWeek, activeMonth, storageBytes, newUsersDaily, platforms]
      properties:
        totalUsers:
          type: integer
          format: int64
        newUsersToday:
          type: integer
          format: int64
        activeToday:
          type: integer
          format: int64
          description: 今天有设备活动的用户数（按北京时间）
        activeWeek:
          type: integer
          format: int64
          description: 最近 7 天有设备活动的用户数
        activeMonth:
          type: integer
          format: int64
          description: 最近 30 天有设备活动的用户数
        storageBytes:
          type: integer
          format: int64
          description: 全部用户的附件总用量
        newUsersDaily:
          type: array
          description: 最近 30 天每天新增的用户数（含今天，没有新增的日期为 0）
          items:
            $ref: '#/components/schemas/DailyCount'
        platforms:
          type: array
          description: 最近 30 天活跃的已登录设备的平台分布
          items:
            $ref: '#/components/schemas/PlatformCount'

    DailyCount:
      type: object
      required: [day, count]
      properties:
        day:
          type: string
          format: date
        count:
          type: integer
          format: int64

    PlatformCount:
      type: object
      required: [platform, devices]
      properties:
        platform:
          type: string
        devices:
          type: integer
          format: int64

    AdminDashboardEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/AdminDashboard'

    AdminUserSummary:
      type: object
      required: [id, username, nickname, createdAt, deviceCount, storageBytes]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        nickname:
          type: string
        phoneMasked:
          type: string
          description: 脱敏的手机号，如 +86 138****5678；未绑定时省略
        createdAt:
          type: string
          format: date-time
        lastActiveAt:
          type: string
          format: date-time
        deviceCount:
          type: integer
          format: int64
          description: 已登录的设备数
        storageBytes:
          type: integer
          format: int64

    AdminUserListEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data, meta]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/AdminUserSummary'

    AdminUserDevice:
      type: object
      required: [id, platform, model, osVersion, appVersion, lastActiveAt, createdAt, signedIn, localReminders, pushEnabled, ackSeq]
      properties:
        id:
          type: string
          format: uuid
        platform:
          type: string
        model:
          type: string
        osVersion:
          type: string
        appVersion:
          type: string
        lastActiveAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        signedIn:
          type: boolean
          description: false 表示已退出登录或被下线
        localReminders:
          type: boolean
          description: 设备能否自己按时弹出提醒
        pushEnabled:
          type: boolean
          description: 是否注册了推送
        ackSeq:
          type: integer
          format: int64
          description: 设备已同步到的序号

    AdminUserDetail:
      type: object
      required: [user, settings, devices, sync, storage]
      properties:
        user:
          $ref: '#/components/schemas/AdminUserSummary'
        settings:
          $ref: '#/components/schemas/Settings'
        devices:
          type: array
          items:
            $ref: '#/components/schemas/AdminUserDevice'
        sync:
          type: object
          required: [serverSeq]
          properties:
            serverSeq:
              type: integer
              format: int64
              description: 服务端最新的同步序号；设备的 ackSeq 小于它表示还有未同步的修改
            lastSyncAt:
              type: string
              format: date-time
              description: 最后一次有数据写入服务端的时间
        storage:
          type: object
          required: [used, quota]
          properties:
            used:
              type: integer
              format: int64
            quota:
              type: integer
              format: int64

    AdminUserDetailEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/AdminUserDetail'

    AuditAction:
      type: string
      enum:
        - login
        - login_failed
        - logout
        - view_dashboard
        - list_users
        - view_user
        - change_password
        - create_admin
        - update_admin
        - reset_password
        - list_audit_logs
        - list_admins

    AuditLog:
      type: object
      required: [id, username, action, targetType, targetId, ip, userAgent, detail, createdAt]
